<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pépite</title>
    <!-- Theme before the first paint (step 6b, D7): dark unless the user chose light. -->
    <script>
      try {
        if (localStorage.getItem('pepite-theme') === 'light')
          document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
