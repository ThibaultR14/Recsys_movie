[project]
name = "pepite-pipeline"
version = "0.1.0"
description = "Offline data pipeline: MovieLens + TMDB -> ALS model -> static files for the website."
requires-python = ">=3.12,<3.13"
dependencies = [
    "implicit>=0.7,<0.8",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "threadpoolctl>=3.8.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
